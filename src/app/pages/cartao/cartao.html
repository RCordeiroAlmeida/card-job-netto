<div
  class="flex flex-col items-center justify-center min-h-screen bg-black overflow-x-hidden"
  style="font-family: 'MuseoModerno', sans-serif; padding: 24px 16px"
>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=MuseoModerno:ital,wght@0,100..900;1,100..900&display=swap');

    .scene {
      width: 100%;
      max-width: 340px;
      height: 520px;
      perspective: 1200px;
      position: relative;
      transition:
        max-width 0.7s cubic-bezier(0.22, 1, 0.36, 1),
        height 0.7s cubic-bezier(0.22, 1, 0.36, 1),
        margin 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .scene.expanded {
      max-width: calc(100% + 32px);
      width: calc(100% + 32px);
      margin: -24px -16px;
      height: auto;
      min-height: 100vh;
      perspective: none;
    }
    .flipper {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.85s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }
    .flipper.flipped {
      transform: rotateY(180deg);
    }

    .face-front {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 24px;
      overflow: hidden;
    }
    .face-back {
      position: absolute;
      inset: 0;
      border-radius: 24px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
    }
    .face-back.visible {
      opacity: 1;
      pointer-events: auto;
      transition: none;
    }
    .scene.expanded .face-back {
      position: relative;
      inset: auto;
      border-radius: 0;
      min-height: 100vh;
    }

    .front-card {
      width: 100%;
      height: 100%;
      background: #0d2525ff;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      user-select: none;
    }
    .front-glow-1 {
      position: absolute;
      bottom: -60px;
      right: -60px;
      width: 240px;
      height: 240px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.16) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    .front-glow-2 {
      position: absolute;
      top: -40px;
      left: -40px;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    .logo-mark {
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-text {
      font-family: 'MuseoModerno', serif;
      width: 108px;
      height: 76px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      color: #ffffff;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.14em;
      line-height: 1.1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      text-transform: uppercase;
    }
    .logo-sub {
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.25em;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      margin-top: 1px;
    }
    .front-name {
      font-size: 30px;
      font-weight: 100;
      color: #ffffff;
      line-height: 1.05;
      letter-spacing: -0.01em;
    }
    .front-name-secondary {
      color: #ffffff;
      font-size: 15px;
      font-weight: 100;
      line-height: 1.05;
    }
    .front-role {
      font-family: 'Montserrat', serif;
      font-size: 15px;
      font-weight: 100;
      color: #b3b3b3;
      margin-top: 6px;
      letter-spacing: 0.02em;
    }
    .front-clinic {
      font-family: 'Montserrat', serif;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.25em;
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1.8;
    }
    .front-hint {
      font-family: 'Montserrat', serif;
      font-size: 10px;
      color: #b3b3b3;
      margin-top: 2px;
    }
    .front-crp {
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 9px;
      color: rgba(255, 255, 255, 0.5);
      white-space: nowrap;
    }
    .chip {
      width: 36px;
      height: 28px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.08));
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      position: relative;
    }
    .chip::before {
      content: '';
      position: absolute;
      inset: 3px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .back-card {
      width: 100%;
      background: #161616;
      padding: 10px;
      flex: 1; 
      display: flex;
      flex-direction: column;
    }

    .back-btn-wrap {
      padding: 10px 12px 14px;
    }
    .back-btn {
      width: 100%;
      padding: 13px;
      border-radius: 14px;
      background: #0d2525ff;
      color: #ffffff;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition:
        background 0.15s,
        transform 0.1s;
      font-family: 'MuseoModerno', sans-serif;
    }
    .back-btn:active {
      background: #333333;
      transform: scale(0.98);
    }

    .action-buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 24px;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .action-buttons.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
    }
    .action-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 2px solid rgba(78, 82, 82, 0.808);
      background: rgba(111, 131, 131, 0.288);
      color: rgba(255, 255, 255, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, border-color 0.2s;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .action-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
      color: white;
    }
    .action-btn:active {
      transform: scale(0.92);
    }
    .action-btn--whatsapp {
      background: rgba(0, 75, 46, 0.801);
      border-color: rgba(0, 75, 46, 0.123);
      color: #ffffff;
    }
    .action-btn--whatsapp:hover {
      background: rgba(0, 75, 46, 0.801);
      border-color: rgba(0, 75, 46, 0.123);
    }

    /* ========================================================
       NOVOS ESTILOS DO VERSO
       ======================================================== */
    .back-inner.new-style {
      background: #EBE6DA;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 24px;
      text-align: center;
      flex: 1; 
    }

    .profile-logo {
      width: 100px;
      margin-bottom: 5px;
      object-fit: contain;
    }

    .profile-name {
      font-family: 'Montserrat', sans-serif;
      font-size: 20px;
      font-weight: 400;
      letter-spacing: 4px;
      color: #1a1a1a;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .profile-role {
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #4a4a4a;
      margin-bottom: 2px;
      text-transform: uppercase;
    }

    .profile-register {
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      letter-spacing: 1px;
      color: #666;
      margin-bottom: 24px;
    }

    .avatar-wrapper {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border: 4px solid #EBE6DA;
      background: #d4cfc4;
      flex-shrink: 0;
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ESTILO ÚNICO PARA FORMAÇÃO / PÓS */
    .specialty-card-single {
      width: 100%;
      background: #0B2926;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .specialty-icon {
      color: #b08d57;
      margin-bottom: 6px;
    }

    .specialty-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 600;
      color: #b08d57;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    .specialty-text {
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.5;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .link-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }

    .list-item {
      display: flex;
      align-items: center;
      background: #0B2926; 
      border-radius: 12px;
      padding: 16px 20px;
      text-decoration: none;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 400;
      transition: transform 0.15s, opacity 0.15s;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .list-item:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .list-icon {
      margin-right: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }

    .list-text {
      flex: 1;
      text-align: left;
    }

    .list-chevron {
      opacity: 0.7;
    }

    .profile-footer {
      font-family: 'Montserrat', sans-serif;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #666;
      margin-bottom: 20px;
      text-transform: uppercase;
      border-top: 1px solid #c2bdae;
      padding-top: 16px;
      width: 80%;
      margin-top: auto; 
    }

    .back-btn-wrap-new {
      width: 100%;
      padding: 0;
    }
  </style>

      <!-- FRONT -->
      <div class="face-front">
        <div class="front-card" (click)="flipCard()">

              </svg>
            </div>
          </div>
        </div>
      </div>

      <!-- Verso visual apenas para efeito 3D -->
      <div
        style="
          position: absolute;
          inset: 0;
          backface-visibility: hidden;
          -webkit-backface-visibility: hidden;
          transform: rotateY(180deg);
          border-radius: 24px;
          background: linear-gradient(135deg, #333333, #161616);
          pointer-events: none;
        "
      ></div>
    </div>

            <img src="assets/profile.png" alt="Foto profissional" />

            <!-- Salvar Contato -->
            <a class="list-item" (click)="saveContact(); $event.stopPropagation()">
              <div class="list-icon">

          <!-- BOTÃO VOLTAR -->
          <div class="back-btn-wrap back-btn-wrap-new">
            <button class="back-btn" (click)="flipCard()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6" />
              </svg>
              Voltar ao cartão
            </button>
          </div>
          
        </div>
      </div>
    </div>
    <!-- /face-back -->
  </div>
  <!-- /scene -->

  <!-- ACTION BUTTONS (apenas na frente) -->
  <div class="action-buttons" [class.hidden]="isBack">
    <!-- Compartilhar -->
    <button class="action-btn" (click)="shareCard()" aria-label="Compartilhar cartão">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
      </svg>
    </button>

    <!-- Salvar contato -->
    <button class="action-btn" (click)="saveContact()" aria-label="Salvar contato">

  function saveContact() {
    const vcard = "BEGIN:VCARD\n" +
                  "VERSION:3.0\n" +
                  "FN:Job Netto - Fisioterapeuta\n" +
                  "N:Netto;Job;;;\n" +
                  "TITLE:Fisioterapeuta\n" +
                  "TEL;TYPE=WORK,VOICE:+5534991380880\n" +
                  "END:VCARD";
    
    const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
    const url = window.URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.setAttribute('download', 'job-netto.vcf');
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
</script>
